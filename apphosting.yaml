# Firebase App Hosting — production backend (branch: main)
# The staging backend overrides NEXT_PUBLIC_ENV=staging so app/robots.ts emits
# Disallow: / and the *.hosted.app preview never gets indexed.

runConfig:
  # Every page is prerendered, so the CDN serves all HTML and Cloud Run only
  # wakes for /api/*. That makes a cold start cost ~1s on the first chatbot
  # message and nothing else.
  minInstances: 0
  # Hard cost ceiling, not a performance knob. Combined with the rate limits in
  # Phase 3 this is what bounds the LLM spend.
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  timeoutSeconds: 60

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://eflury.com
    availability: [BUILD, RUNTIME]

  # staging until DNS moves. app/robots.ts emits Disallow: / for anything other
  # than "production", which keeps the *.hosted.app preview out of the index
  # while eflury.com still serves the Astro site — two different sites, with
  # every page here canonicalising to the other one.
  #
  # A host-based X-Robots-Tag was tried first and does not work: App Hosting's
  # envoy layer rewrites Host before Next sees it, so the rule never matches.
  #
  # FLIP THIS TO production AS PART OF THE DNS CUTOVER.
  - variable: NEXT_PUBLIC_ENV
    value: staging
    availability: [BUILD, RUNTIME]

  # Same property as the Astro site so the GA4 history is continuous.
  # NOTE: verify this is actually collecting — the shape is unusual for GA4
  # (10 digits rather than 10 alphanumerics).
  - variable: NEXT_PUBLIC_GA_ID
    value: G-6320666588
    availability: [BUILD, RUNTIME]

  # Vertex AI needs no API key: the App Hosting service account authenticates
  # via ADC. Grant it roles/aiplatform.user. europe-west6 is Zurich, chosen for
  # Swiss data residency.
  - variable: VERTEX_LOCATION
    value: europe-west6
    availability: [RUNTIME]

  - variable: UPLOADS_BUCKET
    value: eflury-com-uploads
    availability: [RUNTIME]

  # --- Secrets: NOT YET PROVISIONED -------------------------------------
  #
  # Commented out deliberately. An env var pointing at a secret that does not
  # exist fails the entire rollout, so the site could not deploy at all. With
  # them absent the 73 static pages serve normally and the server routes
  # degrade the way they were built to: /api/chat returns its fallback reply,
  # /api/contact and /api/apply refuse submissions with a clear message rather
  # than accepting them unverified.
  #
  # Uncomment each line as its secret is created (turnstileSecret is done):
  #   firebase apphosting:secrets:set <name> --project eflury-com-prod
  #   firebase apphosting:secrets:grantaccess <name> --backend eflury-com-prod
  #
  # turnstileSecret — PROVISIONED 2026-09-12. The hostname on the Cloudflare
  #   widget must include the *.hosted.app preview host, or the widget refuses
  #   to render there and no token is minted at all.
  # resendApiKey    — needs a Resend account with a verified sending domain.
  # acceptSecret    — MUST equal ACCEPT_SECRET in the Hostinger api/config.php,
  #   or offer links already in clients' inboxes stop validating (60-day TTL).
  # acceptAdminKey  — any random string; only used to mint new offer links.
  # ipHashSalt      — any random string; salts hashed IPs in the rate limiter.
  #
  - variable: TURNSTILE_SECRET_KEY
    secret: turnstileSecret
    availability: [RUNTIME]
  #
  # - variable: RESEND_API_KEY
  #   secret: resendApiKey
  #   availability: [RUNTIME]
  #
  # - variable: ACCEPT_SECRET
  #   secret: acceptSecret
  #   availability: [RUNTIME]
  #
  # - variable: ACCEPT_ADMIN_KEY
  #   secret: acceptAdminKey
  #   availability: [RUNTIME]
  #
  # - variable: IP_HASH_SALT
  #   secret: ipHashSalt
  #   availability: [RUNTIME]
