# Firebase App Hosting — eflury.com (backend eflury-com-prod, europe-west4)
#
# A static personal site: every page is prerendered and served from the CDN.
# Cloud Run only wakes to revalidate /en/ (the YouTube feed, every six hours)
# and for the three newsletter routes under /api/newsletter/.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  timeoutSeconds: 60

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://eflury.com
    availability: [BUILD, RUNTIME]

  # app/robots.ts and the robots meta emit noindex for anything other than
  # "production". Live on eflury.com since 2026-11-12.
  - variable: NEXT_PUBLIC_ENV
    value: production
    availability: [BUILD, RUNTIME]

  # Newsletter (on since 2026-11-13). Both secrets were created by the owner
  # with `firebase apphosting:secrets:set` and granted to this backend.
  - variable: NEXT_PUBLIC_NEWSLETTER
    value: "on"
    availability: [BUILD, RUNTIME]
  - variable: NEWSLETTER_SMTP_USER
    secret: newsletter-smtp-user
    availability: [RUNTIME]
  - variable: NEWSLETTER_SMTP_PASS
    secret: newsletter-smtp-pass
    availability: [RUNTIME]
