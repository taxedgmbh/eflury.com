# Firebase App Hosting — production backend (branch: main)
# The staging backend overrides NEXT_PUBLIC_ENV=staging so app/robots.ts emits
# Disallow: / and the *.hosted.app preview never gets indexed.

runConfig:
  # Every page is prerendered, so the CDN serves all HTML and Cloud Run only
  # wakes for /api/*. That makes a cold start cost ~1s on the first chatbot
  # message and nothing else.
  minInstances: 0
  # Hard cost ceiling, not a performance knob. Combined with the rate limits in
  # Phase 3 this is what bounds the LLM spend.
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  timeoutSeconds: 60

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://eflury.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_ENV
    value: production
    availability: [BUILD, RUNTIME]

  # Same property as the Astro site so the GA4 history is continuous.
  # NOTE: verify this is actually collecting — the shape is unusual for GA4
  # (10 digits rather than 10 alphanumerics).
  - variable: NEXT_PUBLIC_GA_ID
    value: G-6320666588
    availability: [BUILD, RUNTIME]

  # Vertex AI needs no API key: the App Hosting service account authenticates
  # via ADC. Grant it roles/aiplatform.user. europe-west6 is Zurich, chosen for
  # Swiss data residency.
  - variable: VERTEX_LOCATION
    value: europe-west6
    availability: [RUNTIME]

  - variable: UPLOADS_BUCKET
    value: eflury-com-uploads
    availability: [RUNTIME]

  # --- Secrets. Create with:
  #       firebase apphosting:secrets:set <name>
  #       firebase apphosting:secrets:grantaccess <name> --backend eflury-web
  #     Version-pin in production (secret: turnstileSecret@3) so a bad rotation
  #     cannot take the site down.

  # Never existed: the Astro site rendered the Turnstile widget but never called
  # siteverify, so no secret was ever provisioned.
  - variable: TURNSTILE_SECRET_KEY
    secret: turnstileSecret
    availability: [RUNTIME]

  - variable: RESEND_API_KEY
    secret: resendApiKey
    availability: [RUNTIME]

  # Signs offer-acceptance links. MUST be the same value as ACCEPT_SECRET in the
  # Hostinger api/config.php, or links already sent to clients stop validating —
  # they carry a 60-day TTL, so some will be in flight at cutover.
  # See migration/verify-offer-signing.md.
  - variable: ACCEPT_SECRET
    secret: acceptSecret
    availability: [RUNTIME]

  - variable: ACCEPT_ADMIN_KEY
    secret: acceptAdminKey
    availability: [RUNTIME]

  # Rotating salt for hashed IPs in the rate limiter, and for signing newsletter
  # confirmation links.
  - variable: IP_HASH_SALT
    secret: ipHashSalt
    availability: [RUNTIME]

  # Two PHP endpoints already mirror into HubSpot. The CRM mirror is not yet
  # ported; add the credential when it is.
  # - variable: HUBSPOT_TOKEN
  #   secret: hubspotToken
  #   availability: [RUNTIME]
